name: CI

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: python -m pip install clang-format==20.1.8
      - name: Check Allman formatting
        run: >-
          find include src tests tools -type f
          \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [ON, OFF]
        static: [ON, OFF]
        exclude:
          # CMake rejects disabling both library variants.
          - shared: OFF
            static: OFF
        include:
          - os: ubuntu-latest
            shared: OFF
            cc: gcc
          - os: ubuntu-latest
            shared: ON
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Install libxml2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libxml2
      - name: Install libxml2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libxml2:x64-windows
      # Linux builds the script runtime with QuickJS; macOS and Windows build
      # without an engine, which covers the unsupported path.
      - name: Fetch QuickJS (Linux)
        if: runner.os == 'Linux'
        run: echo "ENGINE_ARGS=-DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DHDDVD_BUILD_SHARED=${{ matrix.shared }} -DHDDVD_BUILD_STATIC=${{ matrix.static }} ${ENGINE_ARGS:--DHDDVD_SCRIPT_ENGINE=none}
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DHDDVD_BUILD_SHARED=${{ matrix.shared }} -DHDDVD_BUILD_STATIC=${{ matrix.static }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      # The script runtime's engine, built into libhddvd from a pinned,
      # checksummed QuickJS release.
      - name: Fetch QuickJS
        run: echo "QUICKJS=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      - name: Configure ASan and UBSan
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build -DBUILD_TESTING=ON -DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR="$QUICKJS"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # Separate objects used concurrently (test-threads), under ThreadSanitizer.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      # The script runtime's engine, built into libhddvd from a pinned,
      # checksummed QuickJS release.
      - name: Fetch QuickJS
        run: echo "QUICKJS=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      - name: Configure ThreadSanitizer
        env:
          CC: clang
          CFLAGS: -fsanitize=thread -g -O1
          LDFLAGS: -fsanitize=thread
        run: cmake -S . -B build -DBUILD_TESTING=ON -DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR="$QUICKJS"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev clang-18 clang-tools-18
      # The script runtime's engine, built into libhddvd from a pinned,
      # checksummed QuickJS release.
      - name: Fetch QuickJS
        run: echo "QUICKJS=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      # QuickJS's own sources are third-party and excluded from the report.
      - name: Clang static analyzer
        run: |
          scan-build-18 --use-cc=clang-18 cmake -S . -B build -DBUILD_TESTING=ON -DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR="$QUICKJS"
          scan-build-18 --use-cc=clang-18 --status-bugs --exclude "$QUICKJS" -o scan-report cmake --build build --parallel

  i386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit toolchain and libxml2
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libxml2-dev:i386
      # The script runtime's engine, built into libhddvd from a pinned,
      # checksummed QuickJS release.
      - name: Fetch QuickJS
        run: echo "QUICKJS=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE=$PWD/cmake/toolchains/linux-i386.cmake -DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR="$QUICKJS"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # Only additions to the shared library's ABI are allowed against the base.
  abi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev abigail-tools
      - name: Build base and head with debug info
        env:
          CFLAGS: -g -Og
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          for side in base head; do
            src=$([ "$side" = base ] && echo ../base || echo .)
            cmake -S "$src" -B "../build-$side" -DBUILD_TESTING=OFF -DHDDVD_BUILD_STATIC=OFF
            cmake --build "../build-$side" --parallel --target hddvd
          done
      - name: Compare
        run: tools/abi_check.sh ../build-base/libhddvd.so ../base/include ../build-head/libhddvd.so include

  fuzzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      # The script runtime's engine, built into libhddvd from a pinned,
      # checksummed QuickJS release.
      - name: Fetch QuickJS
        run: echo "QUICKJS=$(tools/fetch_quickjs.sh "$RUNNER_TEMP/quickjs")" >> "$GITHUB_ENV"
      - name: Configure libFuzzer harnesses
        env:
          CC: clang
        run: cmake -S . -B build -DHDDVD_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF -DHDDVD_SCRIPT_ENGINE=quickjs -DHDDVD_QUICKJS_SOURCE_DIR="$QUICKJS"
      - run: cmake --build build --parallel
      # Replay the synthetic seeds, then a short fixed-seed run for the
      # harnesses without seeds, so the job stays deterministic.
      - name: Smoke-run fuzzers
        run: |
          ./build/fuzz-object tests/fixtures/objects/*.hdo
          ./build/fuzz-xmf tests/fixtures/plain_manifest.xmf
          ./build/fuzz-xmu tests/fixtures/plain_markup.xmu tests/fixtures/fuzz/xmu/*
          ./build/fuzz-xpl tests/fixtures/playlist_full.xpl
          ./build/fuzz-script tests/fixtures/scripts/*.hdis
          ./build/fuzz-timemap tests/fixtures/timemap/*
          ./build/fuzz-uri tests/fixtures/fuzz/uri/*
          ./build/fuzz-titlemap tests/fixtures/fuzz/titlemap/*
          ./build/fuzz-display tests/fixtures/fuzz/display/*
          ./build/fuzz-vts tests/fixtures/standard/*.IFO tests/fixtures/fuzz/vts/*
          ./build/fuzz-runtime tests/fixtures/fuzz/runtime/*
          ./build/fuzz-aca -seed=1 -runs=1000
          ./build/fuzz-script -seed=1 -runs=1000
          ./build/fuzz-navigation -seed=1 -runs=1000
