name: CI

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: python -m pip install clang-format==20.1.8
      - name: Check Allman formatting
        run: >-
          find include src tests tools -type f
          \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [ON, OFF]
        include:
          - os: ubuntu-latest
            shared: OFF
            cc: gcc
          - os: ubuntu-latest
            shared: ON
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Install libxml2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libxml2
      - name: Install libxml2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libxml2:x64-windows
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - name: Configure ASan and UBSan
        env:
          CC: clang
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
